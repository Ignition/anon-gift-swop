[package]
name = "rust-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2.93", features = ["serde-serialize"] }
js-sys = "0.3.70"
web-sys = { version = "0.3.70", features = ["console"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
base32 = "0.4"

[dev-dependencies]
proptest = "1.4"


